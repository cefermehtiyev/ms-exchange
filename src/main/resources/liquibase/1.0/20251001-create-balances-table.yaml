databaseChangeLog:
  - changeSet:
      id: create-balances-table
      author: Cefer Mehtiyev
      changes:
        - createTable:
            tableName: balances
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: balance
                  type: NUMERIC(19,8)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
  - changeSet:
      id: add-foreign-key-balances-user
      author: Cefer Mehtiyev
      changes:
        - addForeignKeyConstraint:
            baseTableName: balances
            baseColumnNames: user_id
            constraintName: fk_balances_user_id
            referencedTableName: users
            referencedColumnNames: id
