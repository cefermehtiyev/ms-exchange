databaseChangeLog:
  - changeSet:
      id: create-payments-table
      author: Cefer Mehtiyev
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19, 10)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

  - changeSet:
      id: add-fk-payments-user
      author: Cefer Mehtiyev
      changes:
        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: user_id
            constraintName: fk_payments_user_id
            referencedTableName: users
            referencedColumnNames: id
