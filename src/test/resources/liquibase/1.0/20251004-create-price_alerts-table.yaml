databaseChangeLog:
  - changeSet:
      id: create-test-price-alerts-table
      author: your_name
      changes:
        - createTable:
            tableName: price_alerts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: coin_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: coin_quantity
                  type: NUMERIC(19,8)
                  constraints:
                    nullable: false
              - column:
                  name: target_price
                  type: NUMERIC(19,10)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: executed
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
  - changeSet:
      id: add-fk-price-alert-user
      author: Cefer Mehtiyev
      changes:
        - addForeignKeyConstraint:
            baseTableName: price_alerts
            baseColumnNames: user_id
            constraintName: fk_price_alert_user_id
            referencedTableName: users
            referencedColumnNames: id