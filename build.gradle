plugins {
    id "java"
    id "org.springframework.boot" version "$springBootVersion"
    id "io.spring.dependency-management" version "$dependencyManagementVersion"
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // Configuration processor
    implementation 'org.springframework.boot:spring-boot-configuration-processor'


    // Spring Boot
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"

    //openFeign
    implementation "org.springframework.cloud:spring-cloud-starter-openfeign:${openFeign}"

    // Retry
    implementation "org.springframework.retry:spring-retry"

    // Swagger / OpenAPI
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:$openApiVersion"
    implementation "org.springdoc:springdoc-openapi-ui:1.6.6" // istəyə görə silinə bilər

    // Lombok
    compileOnly "org.projectlombok:lombok:$lombok"
    annotationProcessor "org.projectlombok:lombok:$lombok"

    // OpenFeign
    implementation "org.springframework.cloud:spring-cloud-starter-openfeign:$openFeign"

    // Redis (Redisson)

    // ShedLock
    implementation "net.javacrumbs.shedlock:shedlock-spring:$shedlockVersion"
    implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc-template:$shedlockVersion"

    // JWT
    implementation "com.nimbusds:nimbus-jose-jwt:$jwtVersion"

    // Liquibase
    implementation "org.liquibase:liquibase-core"



    // PostgreSQL driver
    runtimeOnly "org.postgresql:postgresql"

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // ---------------------------
// TEST dependencies (JUnit)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework.security:spring-security-test'


    // ---------------------------
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    //security
    implementation 'org.springframework.boot:spring-boot-starter-security'


    runtimeOnly 'com.oracle.database.jdbc:ojdbc11:23.3.0.23.09'

    testImplementation 'com.github.springtestdbunit:spring-test-dbunit:1.3.0'
    testImplementation 'org.hsqldb:hsqldb'

    testImplementation 'com.h2database:h2'



}

tasks.named('test') {
    useJUnitPlatform()
}
